[package]
name = "gx-module-frame"
version = "0.1.0"
edition = "2021"
publish = false
description = "A tiny example module of the module ABI v1 that declares one frame, for the frames slots of tests."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gx-core = { path = "../gx-core", default-features = false }
gx-module-guest = { path = "../gx-module-guest" }
