[package]
name = "gx-module-host"
version = "0.1.0"
edition = "2021"
publish = false
description = "The native worker's module host: runs compiler modules under the module ABI v1."

[dependencies]
gx-core = { path = "../gx-core" }
wasmtime = { version = "=50.0.1", default-features = false, features = ["cranelift", "runtime", "std"] }
wasmparser = "=0.261.0"

[dev-dependencies]
wat = "1"
