[package]
name = "conformance-gen"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
gx-core = { path = "../../crates/gx-core" }
gx-module-guest = { path = "../../crates/gx-module-guest" }
gx-module-test = { path = "../../crates/gx-module-test" }
